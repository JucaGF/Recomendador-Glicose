[project]
name = "glicose"
version = "0.1.0"
description = "Recomendador de refeições e caminhadas para controle glicêmico com os dados do CGMacros"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "keras>=3.15.1",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "tensorflow>=2.21",
    "xgboost",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["glicose", "baixar_dados"]
